spring.application.name=aura-sacrapp-api
server.port=8080

# --- Conexión a MySQL (WAMP) ---
spring.datasource.url=jdbc:mysql://localhost:3306/aura_sacrapp?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate: no crea tablas, solo verifica que las clases calcen con ellas ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# --- Flyway: ejecuta los scripts de db/migration al arrancar ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Variables locales: lee backend/.env si existe (ese archivo no se sube a GitHub) ---
spring.config.import=optional:file:.env[.properties]

# --- JWT ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiracion-minutos=480

# DevTools no reinicia la app al guardar migraciones: se aplican solo al levantar el backend a mano.
spring.devtools.restart.additional-exclude=db/migration/**
