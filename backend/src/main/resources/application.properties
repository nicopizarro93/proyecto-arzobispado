spring.application.name=santiago-sacro-api
server.port=8080

# --- Conexión a MySQL (WAMP) ---
spring.datasource.url=jdbc:mysql://localhost:3306/santiago_sacro?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate: no crea tablas, solo verifica que las clases calcen con ellas ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# --- Flyway: ejecuta los scripts de db/migration al arrancar ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
